name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.26.3"

jobs:
  build-desktop:
    name: Desktop binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: olcrtc-linux-amd64
          - goos: linux
            goarch: arm64
            archive: olcrtc-linux-arm64
          - goos: windows
            goarch: amd64
            archive: olcrtc-windows-amd64
          - goos: darwin
            goarch: amd64
            archive: olcrtc-macos-amd64
          - goos: darwin
            goarch: arm64
            archive: olcrtc-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o olcrtc ./cmd/...

      - name: Package
        run: |
          tar czf ${{ matrix.archive }}.tar.gz olcrtc
          sha256sum ${{ matrix.archive }}.tar.gz > ${{ matrix.archive }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.tar.gz.sha256

  build-mobile:
    name: Mobile cores (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            archive: olcrtc-android-arm64
          - target: arm
            archive: olcrtc-android-armv7
          - target: x86_64
            archive: olcrtc-android-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Android NDK
        run: |
          NDK_DIR=$(ls -d $ANDROID_SDK_ROOT/ndk/*/ 2>/dev/null | sort -V | tail -n1)
          echo "ANDROID_NDK_HOME=${NDK_DIR%/}" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build AAR
        run: |
          mkdir -p dist
          gomobile bind -target=android/${{ matrix.target }} -androidapi 21 -o dist/olcrtc.aar ./mobile

      - name: Package
        run: |
          cd dist && zip -r ../${{ matrix.archive }}.zip . && cd -
          sha256sum ${{ matrix.archive }}.zip > ${{ matrix.archive }}.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.zip
            ${{ matrix.archive }}.zip.sha256

  build-ios:
    name: iOS XCFramework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build XCFramework
        run: |
          mkdir -p dist
          gomobile bind -target=ios -o dist/OlcRTC.xcframework ./mobile
          cd dist && zip -r ../olcrtc-ios.xcframework.zip OlcRTC.xcframework && cd -
          shasum -a 256 olcrtc-ios.xcframework.zip > olcrtc-ios.xcframework.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: olcrtc-ios
          path: |
            olcrtc-ios.xcframework.zip
            olcrtc-ios.xcframework.zip.sha256

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-desktop, build-mobile, build-ios]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}